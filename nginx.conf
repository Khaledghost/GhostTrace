# Nginx configuration for GhostTrace Dashboard
# Place in: /etc/nginx/sites-available/ghosttrace

server {
    listen 80;
    server_name security.yourcompany.com;
    
    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name security.yourcompany.com;

    # SSL Configuration (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/security.yourcompany.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/security.yourcompany.com/privkey.pem;
    
    # SSL Security
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Rate Limiting (additional layer)
    limit_req_zone $binary_remote_addr zone=ghosttrace:10m rate=10r/s;
    
    location / {
        # IP Whitelist (office network)
        # Uncomment and adjust for your network
        # allow 192.168.1.0/24;
        # allow 10.0.0.0/16;
        # deny all;
        
        # Rate limiting
        limit_req zone=ghosttrace burst=20 nodelay;
        
        # Proxy to GhostTrace dashboard
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        
        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
        
        # Forward headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # Access and error logs
    access_log /var/log/nginx/ghosttrace-access.log;
    error_log /var/log/nginx/ghosttrace-error.log;
}
