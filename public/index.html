<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Threat Detection</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <span class="status-dot green pulse"></span>
            <h1>DNA - THREAT DETECTION</h1>
        </div>
        <div class="nav-links">
            <button class="nav-link active" data-section="dashboard">DASHBOARD</button>
            <button class="nav-link" data-section="track">TRACK</button>
            <button class="nav-link" data-section="logs">LOGS</button>
        </div>
    </nav>

    <main class="container">
        <!-- Dashboard Section -->
        <section id="dashboard" class="section active">
            <h2>DASHBOARD</h2>
            
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-indicator">
                        <span class="status-dot green"></span>
                    </div>
                    <div class="stat-info">
                        <h3 id="totalProfiles">0</h3>
                        <p>PROFILES</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-indicator">
                        <span class="status-dot yellow"></span>
                    </div>
                    <div class="stat-info">
                        <h3 id="pendingThreats">0</h3>
                        <p>PENDING</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-indicator">
                        <span class="status-dot red"></span>
                    </div>
                    <div class="stat-info">
                        <h3 id="criticalThreats">0</h3>
                        <p>CRITICAL</p>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-indicator">
                        <span class="status-dot green"></span>
                    </div>
                    <div class="stat-info">
                        <h3 id="totalActivities">0</h3>
                        <p>ACTIVITIES</p>
                    </div>
                </div>
            </div>

            <div class="action-panel">
                <h3>ACTIONS</h3>
                <div class="button-group">
                    <button class="btn" data-section="track">TRACK ACTIVITY</button>
                    <button class="btn btn-outline" data-section="logs">VIEW LOGS</button>
                </div>
            </div>
        </section>

        <!-- Track Activity Section -->
        <section id="track" class="section">
            <h2>TRACK ACTIVITY</h2>
            
            <form id="trackForm" class="form">
                <div class="form-group">
                    <label>USER ID</label>
                    <input type="text" id="userId" placeholder="user-123" required>
                </div>
                
                <div class="form-group">
                    <label>ACCOUNT ID</label>
                    <input type="text" id="accountId" placeholder="acc-456" required>
                </div>
                
                <div class="form-group">
                    <label>ACTIVITY TYPE</label>
                    <select id="activityType" required>
                        <option value="login">LOGIN</option>
                        <option value="logout">LOGOUT</option>
                        <option value="resource_access">RESOURCE ACCESS</option>
                        <option value="api_call">API CALL</option>
                        <option value="data_access">DATA ACCESS</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>IP ADDRESS</label>
                    <input type="text" id="ipAddress" placeholder="192.168.1.1">
                </div>
                
                <div class="form-group">
                    <label>LOCATION</label>
                    <input type="text" id="location" placeholder="New York, US">
                </div>
                
                <div class="form-group">
                    <label>DEVICE</label>
                    <input type="text" id="deviceInfo" placeholder="Desktop, Chrome">
                </div>
                
                <button type="submit" class="btn">TRACK</button>
            </form>
            
            <div id="trackResult" class="result-box"></div>
        </section>

        <!-- Request Logs Section -->
        <section id="logs" class="section">
            <h2>REQUEST LOGS</h2>
            
            <div class="logs-controls">
                <button class="btn btn-outline" id="refreshLogsBtn">REFRESH</button>
                <button class="btn btn-outline" id="clearLogsBtn">CLEAR</button>
                <select id="logFilter">
                    <option value="">ALL</option>
                    <option value="GET">GET</option>
                    <option value="POST">POST</option>
                    <option value="PATCH">PATCH</option>
                    <option value="DELETE">DELETE</option>
                </select>
            </div>
            
            <div id="logsContainer" class="logs-container">
                <p class="loading">LOADING...</p>
            </div>
        </section>
    </main>

    <script src="/app.js"></script>
</body>
</html>
