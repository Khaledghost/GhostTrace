# BehavioralDNA — production-oriented stack
# Usage:
#   cp .env.example .env && edit secrets
#   docker compose up -d --build
#   docker compose --profile demo up -d   # includes mock upstream backend

name: behavioral-dna

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-dna}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:?Set DB_PASS in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - internal
    profiles:
      - redis

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: behavioral-dna:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-dna}
      DB_USER: ${DB_USER:-postgres}
      DB_PASS: ${DB_PASS:?Set DB_PASS in .env}
      DB_ENABLED: ${DB_ENABLED:-true}
      DB_SYNC: ${DB_SYNC:-true}
      DB_REQUIRED: ${DB_REQUIRED:-true}
      WAIT_FOR_DB: 'true'
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASS: ${ADMIN_PASS:?Set ADMIN_PASS in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      REDIS_URL: ${REDIS_URL:-}
      TRUST_PROXY: ${TRUST_PROXY:-true}
    ports:
      - '${APP_PUBLISH_PORT:-3001}:3001'
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:3001/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s
    networks:
      - internal
      - edge
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 512M
        reservations:
          memory: 128M
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - app_data:/app/data
    security_opt:
      - no-new-privileges:true

  mock-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: behavioral-dna:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ['dumb-init', '--', 'node', 'mock-backend.js']
    environment:
      HOST: 0.0.0.0
      MOCK_BACKEND_PORT: 3002
    ports:
      - '3002:3002'
    networks:
      - internal
    profiles:
      - demo
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:3002/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - '${NGINX_HTTP_PORT:-80}:80'
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - edge
    profiles:
      - production
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/health']
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  internal:
    driver: bridge
  edge:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  app_data:
